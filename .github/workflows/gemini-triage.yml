name: Gemini Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-gemini
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read this issue:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}
            Decide if it is a "bug", "feature", or "question", then run exactly one command:
            gh issue edit ${{ github.event.issue.number }} --add-label "<label>"
          settings: |
            {"coreTools": ["run_shell_command"]}