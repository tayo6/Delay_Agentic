name: Gemini Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check API key is set
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY secret is missing."
            exit 1
          fi

      - name: Ask Gemini to label it
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_debug: 'true'
          prompt: |
            Read this issue:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

            Decide if it is a "bug", "feature", or "question", then run exactly
            one shell command to apply that label:
            gh issue edit ${{ github.event.issue.number }} --add-label "<label>"
          settings: |
            {"coreTools": ["run_shell_command"]}