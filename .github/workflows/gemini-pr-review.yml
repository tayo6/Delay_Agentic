name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check API key is set
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY secret is missing."
            exit 1
          fi

      - name: Ask Gemini to review the diff
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_debug: 'true'
          prompt: |
            Run "git diff origin/main...HEAD" to see this PR's changes.
            Check specifically for:
            - Any allocation, lock, or logging call inside processBlock
              (not allowed on the audio thread)
            - Parameter ranges that don't match GEMINI.md
            - Missing prepareToPlay/releaseResources handling

            Then run: gh pr comment ${{ github.event.pull_request.number }} --body "<your findings>"
          settings: |
            {"coreTools": ["run_shell_command"]}