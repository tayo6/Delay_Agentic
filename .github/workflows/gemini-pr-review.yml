name: Gemini PR Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true   # a new push supersedes the in-flight review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-gemini
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Run "git diff origin/main...HEAD" to see this PR's changes. Check for:
            - any allocation, lock, or logging call inside processBlock (audio thread = real-time safe only)
            - parameter ranges that don't match GEMINI.md
            - missing prepareToPlay/releaseResources handling
            Then run: gh pr comment ${{ github.event.pull_request.number }} --body "<your findings>"
          settings: |
            {"coreTools": ["run_shell_command"]}