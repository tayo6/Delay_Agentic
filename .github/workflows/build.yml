name: Build VST3
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-deps
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDelay-VST3
          path: build/SimpleDelay_artefacts/Release/VST3/