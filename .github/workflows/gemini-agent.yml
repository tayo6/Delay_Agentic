name: Gemini Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  agent:
    if: github.event_name == 'issues' || contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check API key is set
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libcurl4-openssl-dev libglu1-mesa-dev mesa-common-dev pkg-config

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_debug: 'true'
          prompt: |
            Task from issue "${{ github.event.issue.title }}":
            ${{ github.event.issue.body }}
            ${{ github.event.comment.body }}
          settings: |
            {"coreTools": ["run_shell_command", "read_file", "write_file", "replace", "list_directory"]}