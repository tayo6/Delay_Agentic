name: Gemini Auto-Fix

on:
  workflow_run:
    workflows: ["Build VST3"]
    types: [completed]

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libcurl4-openssl-dev libglu1-mesa-dev mesa-common-dev pkg-config
      - name: Get failed build log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run view ${{ github.event.workflow_run.id }} --log-failed > build-error.log
      - name: Ask Gemini to fix it
        uses: google-github-actions/run-gemini-cli@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          prompt: |
            The build failed — see build-error.log. Find the bug, fix it, verify by running
            "cmake -B build && cmake --build build" yourself, then commit and push to this branch.
          settings: |
            {"coreTools": ["run_shell_command", "read_file", "write_file", "replace", "list_directory"]}