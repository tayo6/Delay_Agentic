name: Run Gemini CLI
description: Verifies GEMINI_API_KEY (via env, never interpolated into shell), then runs the Gemini action with debug logging. The external action version lives ONLY here.
inputs:
  gemini_api_key:
    description: Pass ${{ secrets.GEMINI_API_KEY }} from the caller.
    required: true
  prompt:
    required: true
  settings:
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check GEMINI_API_KEY is set
      shell: bash
      env:
        KEY: ${{ inputs.gemini_api_key }}   # env indirection -> secret content is never re-parsed by the shell
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::GEMINI_API_KEY secret is missing. Add it under Settings -> Secrets and variables -> Actions."
          exit 1
        fi
        echo "GEMINI_API_KEY present (${#KEY} chars)."

    - name: Run Gemini CLI
      # >>> SINGLE SOURCE OF TRUTH for the external action version. <<<
      # Runs dying in ~5s with "can't find action"? THIS is the line to change.
      # Verify tags:  gh api repos/google-github-actions/run-gemini-cli/tags --jq '.[].name'
      # If that 404s, the owner/repo is wrong -> copy the exact `uses:` line from the action's README.
      uses: google-github-actions/run-gemini-cli@v0
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GH_TOKEN: ${{ github.token }}
      with:
        gemini_debug: 'true'
        prompt: ${{ inputs.prompt }}
        settings: ${{ inputs.settings }}